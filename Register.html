<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Smart Solution</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->

    <header>

        <div class="logo">
            SMART SOLUTION
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>

    </header>


    <!-- Register Section -->

    <main class="login-page">

        <div class="login-box">

            <h1>Create Account</h1>

            <p>Join our smart platform</p>


            <form onsubmit="registerUser(event)">

                <!-- Name -->

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >


                <!-- Email -->

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >


                <!-- Password -->

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create password"
                    required
                >


                <!-- Confirm Password -->

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required
                >


                <!-- Register Button -->

                <button type="submit">
                    Create Account →
                </button>

            </form>


            <!-- Login Link -->

            <p class="register-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

              </html>
