<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Deal Confirmed | DealMate AI</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="simple-navbar">

    <a href="index.html" class="logo">
        ✦ DealMate AI
    </a>

</header>


<main class="success-page">

    <div class="success-content">

        <div class="success-circle">
            ✓
        </div>

        <div class="section-label">
            DEAL CONFIRMED
        </div>

        <h1>
            You found your deal!
        </h1>

        <p>
            DealMate AI selected the best available
            option based on your preferences.
        </p>


        <div class="order-summary">

            <div>
                <span>
                    Product
                </span>

                <strong id="successProduct">
                    Selected Product
                </strong>
            </div>


            <div>
                <span>
                    Deal Price
                </span>

                <strong id="successPrice">
                    ₹0
                </strong>
            </div>


            <div>
                <span>
                    Your Saving
                </span>

                <strong id="successSaving">
                    ₹0
                </strong>
            </div>

        </div>


        <div class="success-actions">

            <a
                href="app.html"
                class="primary-btn"
            >
                Find Another Deal
            </a>

            <a
                href="index.html"
                class="outline-btn"
            >
                Back to Home
            </a>

        </div>

    </div>

</main>


<footer>

    <div class="footer-logo">
        ✦ DealMate AI
    </div>

    <p>
        Thank you for shopping smarter.
    </p>

</footer>


<script src="script.js"></script>

</body>
</html>
