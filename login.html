<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | DealMate AI</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="simple-navbar">

    <a href="index.html" class="logo">
        ✦ DealMate AI
    </a>

    <a href="index.html" class="back-link">
        ← Home
    </a>

</header>


<main class="login-page">

    <div class="login-visual">

        <div class="login-symbol">
            ✦
        </div>

        <h1>
            Smarter shopping
            starts here.
        </h1>

        <p>
            Sign in to continue with your
            personalized AI shopping experience.
        </p>

    </div>


    <div class="login-form-box">

        <div class="section-label">
            DEALMATE AI
        </div>

        <h2>
            Welcome back
        </h2>

        <p class="form-intro">
            Enter your details to continue.
        </p>


        <form id="loginForm">

            <label>
                Email address
            </label>

            <input
                type="email"
                id="email"
                placeholder="you@example.com"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="primary-btn full-btn"
            >
                Sign In →
            </button>

        </form>


        <div id="loginMessage"></div>


        <p class="login-note">
            Don't have an account?
            <a href="app.html">
                Start shopping
            </a>
        </p>

    </div>

</main>


<footer>

    <div class="footer-logo">
        ✦ DealMate AI
    </div>

    <small>
        © 2026 DealMate AI
    </small>

</footer>


<script src="script.js"></script>

</body>
</html>
