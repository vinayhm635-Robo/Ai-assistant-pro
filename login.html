<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Smart Solution</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- Header -->

    <header>

        <div class="logo">
            SMART SOLUTION
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="register.html">
                Register
            </a>

        </nav>

    </header>


    <!-- Login -->

    <main class="auth-page">

        <div class="auth-box">

            <div class="auth-icon">
                🔐
            </div>

            <h1>
                Welcome Back
            </h1>

            <p class="auth-subtitle">
                Login to continue
            </p>


            <form onsubmit="loginUser(event)">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login →
                </button>

            </form>


            <p class="bottom-text">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
