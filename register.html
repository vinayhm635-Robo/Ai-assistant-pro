<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account - Smart Solution</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- Header -->

    <header>

        <div class="logo">
            SMART SOLUTION
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>


    <!-- Registration -->

    <main class="auth-page">

        <div class="auth-box">

            <div class="auth-icon">
                👤
            </div>

            <h1>
                Create Account
            </h1>

            <p class="auth-subtitle">
                Join our smart platform
            </p>


            <form onsubmit="registerUser(event)">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >


                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create password"
                    required
                >


                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required
                >


                <button type="submit">
                    Create Account →
                </button>

            </form>


            <p class="bottom-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
